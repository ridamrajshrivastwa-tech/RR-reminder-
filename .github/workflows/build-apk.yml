name: Build & Publish RR Reminder APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag (e.g. v1.0.0) to publish on GitHub Releases'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-apk:
    name: Build RR Reminder Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Check Release Signing Secrets
        id: signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            echo "has_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Unit Tests
        run: gradle :app:testDebugUnitTest --tests "com.example.ExampleUnitTest"

      - name: Build Signed Release APK
        if: steps.signing.outputs.has_release == 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/RR-Reminder-release.apk
          echo "apk_path=dist/RR-Reminder-release.apk" >> "$GITHUB_ENV"

      - name: Build Debug APK (Fallback when release secrets are not configured)
        if: steps.signing.outputs.has_release != 'true'
        run: |
          gradle assembleDebug
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/RR-Reminder-debug.apk
          echo "apk_path=dist/RR-Reminder-debug.apk" >> "$GITHUB_ENV"

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rr-reminder-apk
          path: ${{ env.apk_path }}

      - name: Determine Release Tag
        id: release_meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish APK to GitHub Releases
        if: steps.release_meta.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: RR Reminder ${{ steps.release_meta.outputs.tag }}
          files: ${{ env.apk_path }}
          generate_release_notes: true
